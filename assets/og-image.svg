<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .ink { fill: #18191F; }
      .muted { fill: #6B6C75; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="#FBF6EB"/>
  <!-- Neobrutalist frame -->
  <rect x="18" y="18" width="1164" height="594" rx="28" fill="none" stroke="#18191F" stroke-width="6"/>

  <!-- Header: N mark + wordmark -->
  <g transform="translate(72,68)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#1947E5" stroke="#18191F" stroke-width="5"/>
    <g fill="#FFFFFF">
      <rect x="22" y="22" width="9" height="32"/>
      <rect x="45" y="22" width="9" height="32"/>
      <polygon points="22,22 31,22 54,54 45,54"/>
    </g>
    <text x="96" y="54" class="sans ink" font-size="42" font-weight="800" letter-spacing="-1.5">Nian</text>
  </g>

  <!-- Top-right badge -->
  <g transform="translate(792,82)">
    <rect x="0" y="0" width="336" height="50" rx="25" fill="#FFBD12" stroke="#18191F" stroke-width="4"/>
    <text x="168" y="33" text-anchor="middle" class="sans ink" font-size="20" font-weight="700">Acesso antecipado · Fev/2026</text>
  </g>

  <!-- Headline -->
  <text x="72" y="290" class="sans" font-size="74" font-weight="900" letter-spacing="-2.5">
    <tspan x="72" class="ink">Flashcards sem a</tspan>
    <tspan x="72" dy="88" class="ink">interface dos</tspan><tspan dx="22" fill="#1947E5">anos 90.</tspan>
  </text>

  <!-- Subline -->
  <text x="74" y="486" class="sans muted" font-size="27" font-weight="600">Repetição espaçada · Importa do Anki · Sem fila punitiva</text>

  <!-- Pills row -->
  <g transform="translate(72,520)">
    <g>
      <rect x="0" y="0" width="186" height="48" rx="24" fill="#FFC7DE" stroke="#18191F" stroke-width="3"/>
      <text x="93" y="31" text-anchor="middle" class="sans ink" font-size="18" font-weight="700">✶ Importa do Anki</text>
    </g>
    <g transform="translate(202,0)">
      <rect x="0" y="0" width="196" height="48" rx="24" fill="#61E4C5" stroke="#18191F" stroke-width="3"/>
      <text x="98" y="31" text-anchor="middle" class="sans ink" font-size="18" font-weight="700">✶ Sem fila punitiva</text>
    </g>
    <g transform="translate(414,0)">
      <rect x="0" y="0" width="150" height="48" rx="24" fill="#FFBD12" stroke="#18191F" stroke-width="3"/>
      <text x="75" y="31" text-anchor="middle" class="sans ink" font-size="18" font-weight="700">✶ Card em 5s</text>
    </g>
  </g>

  <!-- Flashcard mock (right) -->
  <g transform="translate(840,250)">
    <!-- hard shadow -->
    <rect x="10" y="10" width="288" height="296" rx="22" fill="#18191F"/>
    <rect x="0" y="0" width="288" height="296" rx="22" fill="#FFFFFF" stroke="#18191F" stroke-width="5"/>
    <!-- subject pill -->
    <rect x="24" y="26" width="158" height="38" rx="19" fill="#61E4C5" stroke="#18191F" stroke-width="3"/>
    <text x="103" y="51" text-anchor="middle" class="sans ink" font-size="16" font-weight="700">Medicina · Cardio</text>
    <text x="244" y="50" text-anchor="middle" class="sans muted" font-size="15" font-weight="700">4 / 18</text>
    <!-- answer -->
    <text x="144" y="150" text-anchor="middle" fill="#1947E5" class="sans" font-size="14" font-weight="700" letter-spacing="2">RESPOSTA</text>
    <text x="144" y="190" text-anchor="middle" class="sans ink" font-size="30" font-weight="900">Espironolactona</text>
    <text x="144" y="218" text-anchor="middle" class="sans muted" font-size="15" font-weight="500">Antagonista da aldosterona.</text>
    <!-- rating buttons -->
    <g transform="translate(24,248)">
      <rect x="0" y="0" width="78" height="34" rx="9" fill="#F95A2C" stroke="#18191F" stroke-width="2.5"/>
      <text x="39" y="23" text-anchor="middle" class="sans ink" font-size="15" font-weight="800">Difícil</text>
      <rect x="86" y="0" width="68" height="34" rx="9" fill="#FFBD12" stroke="#18191F" stroke-width="2.5"/>
      <text x="120" y="23" text-anchor="middle" class="sans ink" font-size="15" font-weight="800">Ok</text>
      <rect x="162" y="0" width="78" height="34" rx="9" fill="#61E4C5" stroke="#18191F" stroke-width="2.5"/>
      <text x="201" y="23" text-anchor="middle" class="sans ink" font-size="15" font-weight="800">Fácil</text>
    </g>
  </g>
</svg>
